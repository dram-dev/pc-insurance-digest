[project]
name = "pc-insurance-digest"
version = "0.1.0"
description = "Curated daily + weekly digest: US P&C insurance and financial services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "defusedxml>=0.7",
    "requests>=2.32",
    "feedparser>=6.0",
    "praw>=7.8",
    "rich>=13.7",
    "click>=8.1",
    "beautifulsoup4>=4.14.3",
    "trafilatura>=2.1.0",
    "databricks-sql-connector>=4.2.6",
    "pdfplumber>=0.11.9",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "digest-core",
]

[project.optional-dependencies]
# Headless-browser fetch for JS-rendered / WAF-blocked sources (see
# src/digest/ingest/render.py). Opt-in because it also needs a one-time browser
# download: `uv sync --extra render && uv run playwright install chromium`.
render = ["playwright>=1.49"]
# Local FastMCP data-analyst server (src/digest/mcp_server.py). Opt-in so the
# core install stays lean: `uv run --extra mcp digest-mcp` (also how .mcp.json
# launches it for Claude Code).
mcp = ["mcp>=1.2"]
# Alpha engine — local ML predicting insurer returns from digest data + signal
# scores (src/digest/{features,alpha}.py). LightGBM is the primary tabular
# learner; pandas builds the as-of panel; scikit-learn supplies CV/metrics +
# the Ridge/logistic baselines; shap is optional per-prediction attribution.
# Opt-in so the core pipeline stays slim: `uv sync --extra ml`.
ml = ["lightgbm>=4.5", "scikit-learn>=1.5", "pandas>=2.2"]
# Per-prediction attribution. Split out because shap → numba/llvmlite has no
# wheels on newer Pythons; lazy-imported, so the engine runs without it.
ml-explain = ["shap>=0.46"]
# Apple-Silicon neural head over item embeddings (src/digest/alpha_mlx.py).
# Separate extra — MLX only installs on macOS arm64: `uv sync --extra ml-mlx`.
ml-mlx = ["mlx>=0.18"]

[project.scripts]
digest = "digest.cli:main"
digest-mcp = "digest.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digest"]

[tool.uv.workspace]
members = ["packages/digest-core"]

[tool.uv.sources]
digest-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
