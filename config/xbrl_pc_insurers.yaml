# Top-10 largest US P&C insurers AVAILABLE via SEC XBRL — concept-registry ingest
# (datasets 1-13 in digest.parse.xbrl_facts). One instance fetch per insurer
# yields every dataset.
#
# Caveat — the very largest US P&C writers are mostly mutual / foreign-owned and
# do NOT file SEC XBRL, so they are not reachable by this route and need the NAIC
# statutory path instead:
#   • State Farm   — #1 US P&C by DPW, pure mutual, no SEC filings
#   • USAA         — reciprocal/private, no SEC filings
#   • Liberty Mutual — files registered debt but no resolvable XBRL instance here
#   • Farmers      — Zurich-owned; the Exchanges don't file separately
#   • Nationwide   — went private 2009 (last 10-K 2010), no short-duration XBRL
#
# This is the largest SEC-filing P&C underwriters with confirmed short-duration
# claims-development XBRL, in rough US direct-premium order.
