# Direct state-DOI press release sources. Phase-1 today is the
# Google News proxies in rss_feeds.yaml; this file backs the direct
# scrapers added in Wave 3 as we go state-by-state.
#
# `selector` is a CSS selector for the news-list container; tune per
# state as the scraper is implemented. `url_template` supports a {year}
# token which the ingestor populates with the current year (handles
# states that paginate by year, like CA CDI).

states:
  - state: CA
    agency: California Department of Insurance
    url_template: "https://www.insurance.ca.gov/0400-news/0100-press-releases/{year}/"
    # Validated live 2026-05-30: releases are <p> (with a .cfm anchor + a
    # span.secondaryHeader date) inside the custom content control.
    selector: ".cs_control.CS_Element_Custom p:has(span.secondaryHeader):has(a[href*='.cfm'])"
    date_selector: ".secondaryHeader"
    enabled: true

  - state: FL
    agency: Florida Office of Insurance Regulation
    url_template: "https://floir.gov/newsroom"
    # Validated live 2026-06-02: FLOIR moved floir.com → floir.gov. Newsroom
    # items are <li> in ul.list-unstyled; the headline is span.newsSummary.h-3
    # and the only anchor is the "Full story" button carrying the item-details
    # URL (date lives in its /YYYY/MM/DD/ path → URL-path date fallback).
    selector: "ul.list-unstyled li:has(a[href*='item-details'])"
    title_selector: "span.newsSummary.h-3"
    enabled: true

  - state: TX
    agency: Texas Department of Insurance
    url_template: "https://www.tdi.texas.gov/news/{year}/index.html"
    # Validated live 2026-06-02: the old /news/ landing page is a GovDelivery
    # subscribe widget (no list) — the real news list is the per-year index,
    # which IS static HTML. Items are <h2 class="news-list-title"> wrapping the
    # article anchor (title + relative href). No render needed — just the URL.
    selector: ".news-list-title"
    enabled: true

  - state: NY
    agency: New York Department of Financial Services
    url_template: "https://www.dfs.ny.gov/reports_and_publications/press_releases"
    # Validated live 2026-05-30: Drupal listing cards; title in an h3 anchor,
    # date in a <time datetime> (caught by the generic date selector).
    selector: ".listing-view__card-content"
    enabled: true

  - state: LA
    agency: Louisiana Department of Insurance
    url_template: "https://www.ldi.la.gov/news/press-releases"
    selector: ".views-row"   # TODO: finalize — see note
    # 2026-06-02: the WAF 403 (plain GET) IS bypassed by the render path (headless
    # browser → 200), and the press list lives at /news/press-releases. But that
    # page renders the full ~149-item archive as date-link + title-link pairs;
    # needs a row-container selector + a recency cap before enabling. render:true
    # is set so it's ready the moment the selector is finalized.
    render: true
    enabled: false
