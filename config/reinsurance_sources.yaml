# Reinsurance Pulse (EKG Lead 1) — priced ROL / ILS-spread indices that feed the
# regime market_cycle axis. Each index stays `enabled: false` until its scraper
# is implemented in reinsurance._fetch_series and validated against the live
# source on the Mac mini (these are published commentary / PDFs / HTML tables,
# not clean APIs — same scaffold discipline as serff.py / state_doi.py).
#
# segment ∈ us_property_cat | retro | casualty | ils
# source  ∈ guycarp | artemis | lane

indices:
  - index_name: guycarp_us_property_cat_rol
    segment: us_property_cat
    source: artemis_rol
    # Guy Carpenter U.S. Property-Cat Rate-on-Line index (base 100 = 1990),
    # republished by Artemis with the full annual series in the page's inline
    # Highcharts config (static — no render). Validated live 2026-06-02: 37
    # points (1990–2026*). Other artemis_rol pages with the same shape:
    #   /global-property-cat-rate-on-line-index/  ·  /regional-...-index/
    url: "https://www.artemis.bm/us-property-cat-rate-on-line-index/"
    enabled: true

  - index_name: artemis_ils_spread
    segment: ils
    source: artemis
    # Artemis Deal Directory — cat-bond spread / expected-loss / multiple.
    url: "https://www.artemis.bm/deal-directory/"
    enabled: false

  - index_name: lane_ils_index
    segment: ils
    source: lane
    # Lane Financial quarterly ILS/cat-bond review (published PDFs).
    url: "http://www.lanefinancialllc.com/"
    enabled: false
