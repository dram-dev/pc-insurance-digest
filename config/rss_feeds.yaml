  # rate filings that the broader query buries in noise.

  - name: google_news_ca_cdi
    url: 'https://news.google.com/rss/search?q=when:7d+(%22California+Department+of+Insurance%22+OR+%22California+insurance+commissioner%22+OR+%22Ricardo+Lara%22+OR+%22CA+rate+filing%22)&hl=en-US&gl=US&ceid=US:en'
