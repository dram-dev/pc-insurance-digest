    topic_hint: regulatory_rate
    limit: 15

  # ── Google News searches (aggregates Reuters/Bloomberg/WSJ on insurance) ──
  - name: google_news_pc_insurance
    url: 'https://news.google.com/rss/search?q=when:48h+(%22P%26C+insurance%22+OR+%22property+casualty%22+OR+%22reinsurance%22)&hl=en-US&gl=US&ceid=US:en'
    topic_hint: commercial_specialty
    limit: 25

  - name: google_news_cat_losses
    url: 'https://news.google.com/rss/search?q=when:48h+(%22catastrophe+losses%22+OR+%22insured+losses%22+OR+%22hurricane+insurance%22+OR+%22wildfire+insurance%22)&hl=en-US&gl=US&ceid=US:en'
    topic_hint: cat_event
    limit: 20

  - name: google_news_insurtech
    url: 'https://news.google.com/rss/search?q=when:48h+(insurtech+OR+%22insurance+AI%22+OR+%22underwriting+AI%22+OR+%22claims+automation%22)&hl=en-US&gl=US&ceid=US:en'
