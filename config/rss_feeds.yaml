  - name: google_news_fair_plan
    url: 'https://news.google.com/rss/search?q=when:14d+(%22FAIR+Plan%22+OR+%22Citizens+Property+Insurance%22+OR+%22Louisiana+Citizens%22+OR+%22insurer+of+last+resort%22)&hl=en-US&gl=US&ceid=US:en'
