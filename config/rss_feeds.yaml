  # but triage will reclassify per-article (ma_capital for deals,
  # underwriting_results for combined-ratio coverage, etc.).

  - name: google_news_ft_insurance
    url: 'https://news.google.com/rss/search?q=when:14d+site:ft.com+(insurance+OR+insurer+OR+reinsurance+OR+%22Lloyd%27s%22)&hl=en-US&gl=US&ceid=US:en'
