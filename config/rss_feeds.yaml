# P&C insurance & financial services RSS feeds.
# topic_hint is a starting prior for triage — not a hard assignment.

feeds:
  # ── Core trade press ─────────────────────────────────────────
  - name: insurance_journal
    url: https://www.insurancejournal.com/rss/news/
    topic_hint: commercial_specialty
    limit: 25

  - name: insurance_journal_national
    url: https://www.insurancejournal.com/rss/news/national/
    topic_hint: commercial_specialty
    limit: 25

  - name: reinsurance_news
    url: https://www.reinsurancene.ws/feed/
    topic_hint: reinsurance_cycle
    limit: 25

  - name: artemis_bm
    url: https://www.artemis.bm/feed/
    topic_hint: reinsurance_cycle
    limit: 25

  - name: carrier_management
    url: https://www.carriermanagement.com/feed/
    topic_hint: underwriting_results
    limit: 20

  # insurance_erm dropped — Cloudflare bot challenge blocks our UA.
  # Investigate later: try a real browser UA or move to a Google News proxy.

  - name: business_insurance
    url: https://www.businessinsurance.com/section/rss
    topic_hint: commercial_specialty
    limit: 20

  - name: claims_journal
    url: https://www.claimsjournal.com/rss/news/
    topic_hint: reserving
    limit: 15

  # pc360 dropped — publisher killed direct RSS (404). Replaced by
  # google_news_personal_lines below.

  # ── Reinsurance-cycle specialists ────────────────────────────
  # trading_risk dropped — redirects to a Zephr paywall on insurance_insider_ils.
  # intelligent_insurer dropped — /feed and /rss both return 404 (publisher killed RSS).
  # Both replaced by google_news_reinsurance below.

  # ── Regulatory + rating agency ───────────────────────────────
  # am_best_news direct RSS blocked by Radware bot detection. Replaced by
  # Google News site:ambest.com proxy below.
  # naic_news direct RSS dead (URL pattern changed). Replaced by
  # Google News site:naic.org proxy below.
  - name: google_news_am_best
    url: 'https://news.google.com/rss/search?q=when:7d+site:ambest.com&hl=en-US&gl=US&ceid=US:en'
    topic_hint: ma_capital
    limit: 15

  - name: google_news_naic
    url: 'https://news.google.com/rss/search?q=when:14d+site:naic.org&hl=en-US&gl=US&ceid=US:en'
    topic_hint: regulatory_rate
    limit: 15

  - name: google_news_personal_lines
    url: 'https://news.google.com/rss/search?q=when:48h+(%22auto+insurance%22+OR+%22home+insurance%22+OR+%22homeowners+insurance%22+OR+%22telematics%22+OR+%22market+exit%22+insurance)&hl=en-US&gl=US&ceid=US:en'
    topic_hint: personal_lines
    limit: 15

  - name: google_news_reinsurance
    url: 'https://news.google.com/rss/search?q=when:7d+(%221%2F1+renewal%22+OR+%22reinsurance+pricing%22+OR+%22reinsurance+capacity%22+OR+%22cat+bond%22+OR+%22ILS+capacity%22+OR+%22retro+market%22)&hl=en-US&gl=US&ceid=US:en'
    topic_hint: reinsurance_cycle
    limit: 15

  # ── Google News searches (aggregates Reuters/Bloomberg/WSJ on insurance) ──
  - name: google_news_pc_insurance
    url: 'https://news.google.com/rss/search?q=when:48h+(%22P%26C+insurance%22+OR+%22property+casualty%22+OR+%22reinsurance%22)&hl=en-US&gl=US&ceid=US:en'
    topic_hint: commercial_specialty
    limit: 25

  - name: google_news_cat_losses
    url: 'https://news.google.com/rss/search?q=when:48h+(%22catastrophe+losses%22+OR+%22insured+losses%22+OR+%22hurricane+insurance%22+OR+%22wildfire+insurance%22)&hl=en-US&gl=US&ceid=US:en'
    topic_hint: cat_event
    limit: 20

  - name: google_news_insurtech
    # Narrowed 2026-05-25 — require insurance-domain qualifier alongside the AI
    # term to stop general AI/LLM news from drowning the feed (already capped at
    # 35% in summarize.py, but the cap should bite less often after this).
    url: 'https://news.google.com/rss/search?q=when:48h+(insurtech+OR+%22insurance+AI%22+OR+%22underwriting+AI%22+OR+%22claims+automation%22+OR+%22AI+claims%22+OR+%22AI+underwriter%22)+(insurance+OR+insurer+OR+carrier+OR+underwriter+OR+MGA+OR+broker)&hl=en-US&gl=US&ceid=US:en'
    topic_hint: ai_insurtech
    limit: 15

  - name: google_news_litigation_tplf
    url: 'https://news.google.com/rss/search?q=when:7d+(%22litigation+funding%22+OR+%22third+party+funding%22+OR+%22nuclear+verdict%22+OR+%22mass+tort%22)&hl=en-US&gl=US&ceid=US:en'
    topic_hint: social_inflation
    limit: 15

  - name: google_news_insurer_ma
    url: 'https://news.google.com/rss/search?q=when:7d+(%22insurer+acquisition%22+OR+%22insurance+M%26A%22+OR+%22carrier+merger%22+OR+%22broker+acquisition%22)&hl=en-US&gl=US&ceid=US:en'
    topic_hint: ma_capital
    limit: 15

  - name: google_news_state_doi
    url: 'https://news.google.com/rss/search?q=when:7d+(%22rate+filing%22+OR+%22Department+of+Insurance%22+OR+%22SERFF%22+OR+%22insurance+commissioner%22)&hl=en-US&gl=US&ceid=US:en'
    topic_hint: regulatory_rate
    limit: 15

