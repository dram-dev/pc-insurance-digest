  # ── Quarterly auto-insurance industry research (Phase 1: GN proxy) ─
  # LexisNexis Risk Solutions "US Auto Insurance Trends" + JD Power
  # auto-insurance studies + shopping-behavior reports. Phase 2 would
  # promote these to a direct scraper if signal warrants.
  - name: google_news_industry_research
    url: 'https://news.google.com/rss/search?q=when:14d+((%22LexisNexis+Risk+Solutions%22+%22auto+insurance%22)+OR+(%22J.D.+Power%22+%22auto+insurance%22)+OR+(%22LexisNexis%22+%22insurance+demand%22)+OR+(%22Insurance+Demand+Meter%22))&hl=en-US&gl=US&ceid=US:en'
