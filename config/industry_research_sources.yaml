# Phase 2 direct-scraper sources for industry research (LexisNexis + JD Power).
# Phase 1 is the google_news_industry_research RSS proxy in rss_feeds.yaml.
# Flip enabled:true after validating the CSS selector with curl on the Mac mini:
#   curl -sL -A 'Mozilla/5.0' <url> | grep -A5 'article\|post\|press\|release'
#
# title_filter is a case-insensitive substring match; only items whose title
# contains this string are emitted.

sources:
  - name: lexisnexis_risk
    vendor: LexisNexis Risk Solutions
    url: "https://risk.lexisnexis.com/insights-resources"
    title_filter: "auto insurance"
    selector: ".masonry-resource-listing-item"
    title_selector: ".masonry-resource-listing-item-title"
    # Validated live 2026-06-02 via the render path: the resource feed is an
    # Algolia/JS "masonry-resource-listing" (static HTML is only nav chrome) —
    # 24 cards after rendering; title in .masonry-resource-listing-item-title,
    # link is the card anchor. The "auto insurance" filter gates to P&C content.
    render: true
    enabled: true

  - name: jdpower_auto
    vendor: JD Power
    url: "https://www.jdpower.com/business/press-releases"
    title_filter: "auto insurance"
    selector: ".result"
    # Validated live 2026-06-02 via the render path (a plain GET 403s — WAF; a
    # real headless browser gets 200). 12 .result press-release cards; the
    # "auto insurance" filter gates to JD Power's periodic auto-insurance studies
    # (0 items on days without one — expected, not a failure).
    render: true
    enabled: true
