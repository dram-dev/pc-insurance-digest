# Phase 2 direct-scraper sources for industry research (LexisNexis + JD Power).
# Phase 1 is the google_news_industry_research RSS proxy in rss_feeds.yaml.
# Flip enabled:true after validating the CSS selector with curl on the Mac mini:
#   curl -sL -A 'Mozilla/5.0' <url> | grep -A5 'article\|post\|press\|release'
#
# title_filter is a case-insensitive substring match; only items whose title
# contains this string are emitted.

sources:
  - name: lexisnexis_risk
    vendor: LexisNexis Risk Solutions
    url: "https://risk.lexisnexis.com/insights-resources"
    title_filter: "auto insurance"
    selector: "article, .insight-card, .resource-item, .content-card"
    # 2026-06-02: page returns 200 but the resource feed is JS-rendered
    # (Algolia "masonry-resource-listing" hits load client-side); static HTML
    # holds only nav chrome (.highlight-card = Careers/News Room/…). Needs a
    # rendered fetch or the site's search API — not a selector fix. Stay off.
    enabled: false

  - name: jdpower_auto
    vendor: JD Power
    url: "https://www.jdpower.com/business/press-releases"
    title_filter: "auto insurance"
    selector: ".press-release-item, article.press, .pr-list li, table.press-releases tr"
    # 2026-06-02: returns 403 (WAF/bot-blocked) even on a real browser UA. Needs
    # a different fetch strategy before the selector can be validated. Stay off.
    enabled: false
