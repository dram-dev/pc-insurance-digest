  # ── Broker holdings (limited reserving content but track) ──
  - ticker: MMC
    name: Marsh McLennan
    url_template: "https://www.marshmclennan.com/content/dam/mmc-web/insights/{year}-Q{q}-Financial-Supplement.pdf"
