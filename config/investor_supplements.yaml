    enabled: false

  # ── Bermuda reinsurers (P&C-relevant) ──
  - ticker: RNR
    name: RenaissanceRe
    url_template: "https://www.renre.com/sites/default/files/{year}-Q{q}-Financial-Supplement.pdf"
    enabled: false

  - ticker: EG
    name: Everest Group
    url_template: "https://www.everestre.com/Investors-Section/financials/{year}-Q{q}-supplement.pdf"
    enabled: false

  - ticker: AXS
    name: AXIS Capital
    url_template: "https://www.axiscapital.com/investors/financial-information/{year}-Q{q}-Supplement.pdf"
